name: Build TWRP (uws6152_1h10_go / M92K-W527)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/share/chromium || true
          sudo apt-get clean || true
          docker system prune -af || true
          df -h /

      - name: Build inside Ubuntu 20.04 container (python2 + libtinfo5 available)
        run: |
          docker pull ubuntu:20.04
          docker run --rm -v "$GITHUB_WORKSPACE":/src -w /work ubuntu:20.04 bash -c '
            set -e
            if ! apt-get update; then
              echo "archive failed, switching to old-releases"
              sed -i "s|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g" /etc/apt/sources.list
              apt-get update
            fi
            export DEBIAN_FRONTEND=noninteractive
            apt-get install -y --no-install-recommends \
              git curl ca-certificates python2 python3 bc bison build-essential ccache cpio flex \
              g++-multilib gcc-multilib gperf imagemagick lib32ncurses5-dev lib32z1-dev libc6-dev \
              libgl1-mesa-dev liblz4-tool liblz4-dev libncurses5 libncurses5-dev libsdl1.2-dev \
              libssl-dev libwxgtk3.0-gtk3-dev libx11-dev libxml2 libxml2-utils lzop m4 ncftp \
              pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
            ln -sf /usr/bin/python2 /usr/bin/python
            python --version
            ldconfig -p | grep -E "libtinfo|libncurses" | head -5

            curl -s https://storage.googleapis.com/git-repo-downloads/repo > /usr/local/bin/repo
            chmod +x /usr/local/bin/repo
            git config --global user.name "twrp-builder"
            git config --global user.email "twrp-builder@users.noreply.github.com"
            git config --global color.ui false

            mkdir -p /work && cd /work
            repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-9.0
            repo sync -j$(nproc --all) --force-sync --no-clone-bundle

            mkdir -p device/sprd/uws6152_1h10_go
            rsync -a --exclude ".git" --exclude "workspace" /src/ device/sprd/uws6152_1h10_go/
            ls device/sprd/uws6152_1h10_go

            echo "--- applying vibrator (input FF) patch ---"
            python3 device/sprd/uws6152_1h10_go/patches/apply.py
            grep -n "ff_vibrator_play" bootable/recovery/minuitwrp/events.cpp | head -5

            source build/envsetup.sh
            export ALLOW_MISSING_DEPENDENCIES=true
            lunch omni_uws6152_1h10_go-eng
            make -j$(nproc --all) recoveryimage

            ls -l out/target/product/uws6152_1h10_go/recovery.img
            cp out/target/product/uws6152_1h10_go/recovery.img /src/recovery.img
          '

      - name: Hash result
        run: |
          ls -l recovery.img
          sha256sum recovery.img | tee recovery.img.sha256
          echo "### recovery.img built" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat recovery.img.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-img
          path: |
            recovery.img
            recovery.img.sha256
          if-no-files-found: error
