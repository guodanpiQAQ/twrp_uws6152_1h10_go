name: Build TWRP (uws6152_1h10_go / M92K-W527)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/local/share/chromium || true
          sudo apt-get clean || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gperf gcc-multilib g++-multilib libc6-dev lib32ncurses5-dev \
            x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc \
            bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev \
            libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp \
            qemu-user-static libstdc++-10-dev python3 zip unzip || true
          sudo apt-get install -y git curl python2 python2.7 python-is-python2 || true
          echo "--- tool check ---"
          for t in git make gcc g++ zip unzip bc python3; do command -v $t || echo "MISSING $t"; done
          (command -v python2 || command -v python2.7 || echo "no python2 (will warn later)")

      - name: Make sure swap exists
        continue-on-error: true
        run: |
          free -h
          sudo swapon --show || true
          if [ "$(free -m | awk '/Swap:/{print $2}')" -lt 2048 ]; then
            sudo fallocate -l 8G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=8192 || true
            sudo chmod 600 /swapfile2 || true
            sudo mkswap /swapfile2 || true
            sudo swapon /swapfile2 || true
          fi
          free -h

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          git config --global user.name "twrp-builder"
          git config --global user.email "twrp-builder@users.noreply.github.com"
          git config --global color.ui false
          ~/bin/repo --version || python3 ~/bin/repo --version

      - name: repo init and sync (twrp-9.0)
        run: |
          mkdir -p workspace
          cd workspace
          ~/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni -b twrp-9.0
          ~/bin/repo sync -j$(nproc --all) --force-sync --no-clone-bundle
        timeout-minutes: 180

      - name: Copy device tree into AOSP tree
        run: |
          mkdir -p workspace/device/sprd/uws6152_1h10_go
          rsync -a --exclude '.git' --exclude 'workspace' ./ workspace/device/sprd/uws6152_1h10_go/
          ls -la workspace/device/sprd/uws6152_1h10_go | head -20

      - name: Switch python to python2 (AOSP 9 tools need it)
        run: |
          P=""
          if command -v python2.7 >/dev/null; then P=$(command -v python2.7); elif command -v python2 >/dev/null; then P=$(command -v python2); fi
          if [ -n "$P" ]; then sudo ln -sf "$P" /usr/bin/python; python --version; else echo "::warning::python2 not found, build may fail at mkbootimg/avbtool"; fi

      - name: Build recoveryimage
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_uws6152_1h10_go-eng
          make -j$(nproc --all) recoveryimage
        working-directory: workspace
        timeout-minutes: 180

      - name: Show / hash result
        run: |
          IMG=out/target/product/uws6152_1h10_go/recovery.img
          ls -l $IMG
          sha256sum $IMG | tee recovery.img.sha256
          echo "### recovery.img OK" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat recovery.img.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        working-directory: workspace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: recovery-img
          path: |
            workspace/out/target/product/uws6152_1h10_go/recovery.img
            workspace/recovery.img.sha256
          if-no-files-found: error
